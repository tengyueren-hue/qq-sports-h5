<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ运动 · 周报原型</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f2;font:14px -apple-system,"PingFang SC",sans-serif;color:#202520}aside{position:fixed;left:28px;top:32px;width:230px}h1{font-size:22px}p{line-height:1.8;color:#777}a,button{display:block;margin:10px 0;padding:12px;border-radius:12px;background:white;border:0;text-decoration:none;color:#214ca5;width:100%;text-align:left;cursor:pointer}iframe{display:block;margin:20px auto;width:428px;height:calc(100dvh - 40px);border:0;border-radius:18px}label{display:block;margin-top:24px}@media(max-width:950px){aside{position:static;width:auto;padding:8px 16px;display:flex;gap:8px;overflow:auto}aside h1,aside p,aside label{display:none}aside a{white-space:nowrap;min-width:105px;text-align:center;margin:0}iframe{margin:0 auto;height:calc(100dvh - 58px);border-radius:0}}@media(max-width:428px){iframe{width:100%}}</style><body><aside><h1>QQ运动 · 周报</h1><p>基础页面沿用模板。新周报按Figma设计还原。</p><a href="plugin.html" target="prototype">插件页</a><a href="home.html" target="prototype">运动首页</a><a href="home.html?entry=compact" target="prototype">24小时后</a><a href="home.html?report=open" target="prototype">周报弹窗</a><a href="report.html" target="prototype">完整周报</a><a href="share.html" target="prototype">分享预览</a><label><input id="device" type="checkbox" checked> 已绑定设备</label><p>上滑弹窗逐步全屏。数值与二维码为设计示例；原生分享和补卡尚未接入线上。</p></aside><iframe name="prototype" title="QQ运动周报原型" src="plugin.html"></iframe><script>document.querySelector('#device').onchange=e=>document.querySelector('iframe').contentWindow.postMessage({type:'qq-device',bound:e.target.checked},location.origin);</script></body></html>
