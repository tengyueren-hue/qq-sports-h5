<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ运动 · 周报状态预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef0f2;font:14px -apple-system,"PingFang SC",sans-serif;color:#202520}aside{position:fixed;left:calc(50% + 244px);top:32px;width:240px}h1{font-size:20px}p{line-height:1.7;color:#777}fieldset{border:0;padding:0;margin:24px 0}legend{font-weight:600;margin-bottom:10px}.options{display:flex;background:#e0e4e2;border-radius:10px;padding:3px;gap:3px}label{flex:1;text-align:center;cursor:pointer}label input{position:absolute;opacity:0}label span{display:block;padding:10px 4px;border-radius:8px;font-size:12px}input:checked+span{background:white;color:#178645;box-shadow:0 1px 4px #0001}input:focus-visible+span{outline:2px solid #09f}button{padding:10px 16px;border:1px solid #ccd2cf;background:transparent;border-radius:10px;cursor:pointer;color:#52605a}iframe{display:block;margin:20px auto;width:428px;height:calc(100dvh - 40px);border:0;border-radius:18px}@media(max-width:1000px){body{display:flex;flex-direction:column;height:100dvh}aside{position:static;width:100%;padding:8px 12px;display:flex;gap:10px;flex-wrap:wrap}aside h1,aside p{display:none}fieldset{margin:0;flex:1;min-width:105px}legend{font-size:11px;margin-bottom:4px}label span{padding:7px 2px;font-size:10px}button{font-size:11px;padding:5px 9px}iframe{margin:0 auto;min-height:0;flex:1;height:auto;border-radius:0;max-width:100%}}</style>
<body><aside><h1>周报 · 状态预览</h1><fieldset><legend>插件展示时机</legend><div class="options"><label><input type="radio" name="redDay" value="true" checked><span>红点当天</span></label><label><input type="radio" name="redDay" value="false"><span>非红点当天</span></label></div></fieldset><fieldset><legend>穿戴设备</legend><div class="options"><label><input type="radio" name="device" value="true" checked><span>有设备</span></label><label><input type="radio" name="device" value="false"><span>无设备</span></label></div></fieldset><fieldset><legend>本周达标情况</legend><div class="options"><label><input type="radio" name="allGoals" value="false" checked><span>未全部达标</span></label><label><input type="radio" name="allGoals" value="true"><span>全部达标</span></label></div></fieldset><button id="reset">重新体验</button><p>点击插件周报入口查看报告。开关即时生效，隐藏模块后内容自动上移。数据为演示。</p></aside><iframe name="prototype" title="QQ运动周报原型"></iframe><script>
const frame=document.querySelector('iframe');let state={redDay:true,device:true,allGoals:false};try{Object.assign(state,JSON.parse(sessionStorage.getItem('weekly-demo-state')||'{}'))}catch{}for(const[k,v]of Object.entries(state)){const input=document.querySelector(`input[name="${k}"][value="${v}"]`);if(input)input.checked=true}function send(){sessionStorage.setItem('weekly-demo-state',JSON.stringify(state));frame.contentWindow.postMessage({type:'weekly-state',state},location.origin)}document.querySelectorAll('input').forEach(input=>input.onchange=()=>{state[input.name]=input.value==='true';send()});frame.onload=send;document.querySelector('#reset').onclick=()=>frame.src='plugin.html';frame.src='plugin.html';
</script></body></html>
